name: Pinned upstream parity

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    name: just-bash 3.6.0 differential gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare live runtimes (separate from go test)
        env:
          PARITY_REPORT_DIR: ${{ runner.temp }}/parity-report
        run: bash internal/parity/run.sh
      - name: Upload live observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-parity-report
          path: ${{ runner.temp }}/parity-report/report.json
          if-no-files-found: warn
